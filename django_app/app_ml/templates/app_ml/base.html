{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}ML Animal World{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1020;
      --card-bg: #151b2f;
      --accent: #ffb347;
      --accent-soft: rgba(255, 179, 71, 0.2);
      --text: #f9fbff;
      --muted: #c3c7f5;
      --danger: #ff6b81;
      --ok: #4cd4a8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #283766 0, #050712 50%, #020309 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .paw-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.06;
      background-image:
        radial-gradient(circle at 10% 20%, #ffffff 1px, transparent 0),
        radial-gradient(circle at 80% 30%, #ffffff 1px, transparent 0),
        radial-gradient(circle at 30% 80%, #ffffff 1px, transparent 0);
      z-index: -1;
    }

    header {
      backdrop-filter: blur(16px);
      background: rgba(10, 12, 25, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1rem;
    }

    .nav-logo {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #fff7e6 0, #ffb347 40%, #ff7b72 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-link {
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .nav-link:hover {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      transform: translateY(-1px);
    }

    .nav-link-primary {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }

    main {
      max-width: 1100px;
      width: 100%;
      margin: 24px auto 40px;
      padding: 0 16px;
      flex: 1;
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .hero-title {
      font-size: 1.8rem;
      font-weight: 600;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .hero-subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 620px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .pill {
      font-size: 0.75rem;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      gap: 16px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .hero-title {
        font-size: 1.4rem;
      }
    }

    .btn {
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #241426;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.6);
    }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px dashed rgba(255, 255, 255, 0.18);
      box-shadow: none;
    }

    .field-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .footer {
      font-size: 0.75rem;
      text-align: center;
      color: var(--muted);
      padding: 12px 0 18px;
      opacity: 0.7;
    }

    .page-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="paw-bg"></div>
  <header>
    <nav class="nav">
      <div class="nav-left">
        <div class="nav-logo">🐾</div>
        <span>ML Animal World</span>
      </div>
      <div class="nav-links">
        <!-- OJO: cambia 'home', 'predict_image', etc. si tus nombres en urls.py son otros -->
        <a class="nav-link" href="{% url 'app_ml:home' %}">Home 🏠</a>
        <a class="nav-link" href="{% url 'app_ml:predict_image' %}">Animal Classifier 🦊</a>
        <a class="nav-link" href="{% url 'app_ml:predict_text' %}">Steam Review 🎮</a>
        <a class="nav-link nav-link-primary" href="{% url 'app_ml:about_models' %}">Meet the Models 🧠</a>
      </div>
    </nav>
  </header>

  <main>
    {% block main %}{% endblock %}
  </main>

  <footer class="footer">
    Made with 🐶 + 🐱 + 🧠 — Machine Learning Project
  </footer>
</body>
</html>
