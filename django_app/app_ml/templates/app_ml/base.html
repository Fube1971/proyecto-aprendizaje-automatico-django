{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}ML Animal World{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* PALETA: Cream & Coffee Editorial */
      --bg-body: #F5F2EB;       /* Crema suave */
      --text-main: #241c15;     /* Café casi negro */
      --text-muted: #6b635b;    /* Café grisáceo */
      --card-bg: #FFFFFF;       /* Blanco puro */
      
      --font-main: 'Fredoka', sans-serif;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Centrado Minimalista */
    header {
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 50px;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.5rem;
      text-decoration: none;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-link {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 1.05rem;
      transition: color 0.2s ease;
    }
    
    .nav-link:hover { color: var(--text-main); }

    /* Layout Principal */
    main {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
    }

    footer {
      text-align: center;
      padding: 60px 20px 40px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 400;
    }

    /* Utilidades */
    .btn {
      display: inline-block;
      background: var(--text-main);
      color: #fff;
      padding: 14px 36px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    
    /* Inputs Estilo Editorial */
    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #ddd;
      color: var(--text-main);
      padding: 18px;
      border-radius: var(--radius);
      font-family: var(--font-main);
      font-size: 1rem;
      margin-bottom: 15px;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--text-main);
    }

  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="{% url 'app_ml:home' %}" class="nav-logo">ML World.</a>
      <nav class="nav-links">
        <a class="nav-link" href="{% url 'app_ml:home' %}">Home</a>
        <a class="nav-link" href="{% url 'app_ml:predict_image' %}">Vision</a>
        <a class="nav-link" href="{% url 'app_ml:predict_text' %}">NLP</a>
        <a class="nav-link" href="{% url 'app_ml:about_models' %}">Models</a>
      </nav>
    </div>
  </header>

  <main>
    {% block main %}{% endblock %}
  </main>

  <footer>
    <p>Made with 🐶 + 🐱 + 🧠 — Machine Learning Project</p>
  </footer>

</body>
</html>
